apiVersion: v1
kind: Service
metadata:
  name: simple-web-app
  labels:
    app.kubernetes.io/name: simple-web-app
    app.kubernetes.io/instance: simple-web-app
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: simple-web-app
    app.kubernetes.io/instance: simple-web-app
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: simple-web-app
  labels:
    app.kubernetes.io/name: simple-web-app
    app.kubernetes.io/instance: simple-web-app
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: simple-web-app
      app.kubernetes.io/instance: simple-web-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: simple-web-app
        app.kubernetes.io/instance: simple-web-app
    spec:
      containers:
        - name: simple-web-app
          image: "local/simple-web-server:latest"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /hello-world
              port: http
          readinessProbe:
            httpGet:
              path: /hello-world
              port: http
          resources:
            limits:
              memory: 128Mi
